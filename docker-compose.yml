services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: productsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d productsdb"]
      interval: 5s
      retries: 5

  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  product-service:
    build: ./services/product-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/productsdb
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/ordersdb
    depends_on:
      mongo:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    ports:
      - "4000:4000"
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretkey
    depends_on:
      redis:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - product-service
      - order-service
      - user-service
      - notification-service

volumes:
  postgres_data:
  mongo_data:
